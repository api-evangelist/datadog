    ops: [CreateDowntime, GetDowntime, ListDowntimes, UpdateDowntime, CancelDowntime]
  - group: API key + application key management
    ops: [CreateAPIKey, GetAPIKey, ListAPIKeys, UpdateAPIKey, DeleteAPIKey]
  - group: Log ingestion & config
    ops: [SubmitLog, CreateLogsArchive, UpdateLogsArchive, DeleteLogsArchive, GetLogsArchive, ListLogsArchives, CreateLogsMetric, CreateLogsIndex]
  - group: Metric submission & query
    ops: [SubmitMetrics, queryMetricsTimeseries, QueryTimeseriesData, QueryScalarData]
  - group: User, role, team lifecycle
    ops: [CreateUser, UpdateUser, ListUsers, GetUser, CreateRole, GetRole, DeleteRole, ListRoles, CreateTeam, UpdateTeam, GetTeam, DeleteTeam, ListTeams, SendInvitations]
