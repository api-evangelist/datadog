method: derived
source: >-
  Derived by aligning the published Datadog MCP Server tool inventory
  (https://docs.datadoghq.com/mcp_server/tools.md, fetched 2026-09-23) with the
  Datadog v2 REST OpenAPI now split one-per-tag under openapi/ (source archived
  under openapi/_original/datadog-api-openapi.yml, 523 operations across 297
  paths). Confidence per row; MCP tools_list is OAuth-gated, so the bindings
  are by name / semantics, not by a live JSON-RPC probe.
purpose: >-
  Bind each Datadog MCP tool to the REST operationId(s) that back it, so the
  agent-facing surface (MCP tools) has a first-class, machine-checkable link
  to the underlying REST contract. Datadog exposes REST, GraphQL is not used
  here — REST and the MCP Server are two overlapping projections of the same
  Datadog platform.
surfaces:
  rest_openapi: openapi/                           # split one-per-tag; source in _original/datadog-api-openapi.yml (523 operations, 297 paths)
  mcp: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp  # remote HTTP, OAuth-gated; tool inventory from docs.datadoghq.com/mcp_server/tools.md
