tool_configuration:
  query_params:
    toolsets: 'Comma-separated toolset names, or `all` for all GA toolsets.'
    omit_tools: 'Comma-separated tool names to exclude after resolving toolsets.'
    subdomain: 'Custom Datadog subdomain (routes OAuth to `<subdomain>.datadoghq.com`).'
  example_urls:
  - 'https://mcp.datadoghq.com/api/unstable/mcp-server/mcp?toolsets=apm,llmobs'
  - 'https://mcp.datadoghq.com/api/unstable/mcp-server/mcp?toolsets=all&omit_tools=create_datadog_notebook,edit_datadog_notebook'
compliance:
  hipaa_eligible: true
  govcloud: false
  telemetry: >-
    Datadog collects tool-call metadata (tool name, arguments, user identifiers,
    error info) for 120 days to improve the server. The MCP Server itself makes
    no outbound calls to third-party AI providers.
observability:
  audit_trail_event: 'MCP Server'
  metrics:
  - {name: datadog.mcp.session.starts, description: 'Emitted on each MCP session initialization.'}
  - {name: datadog.mcp.tool.usage,     description: 'Distribution metric emitted on each tool call. Tags: user_id, user_email, client, tool_name.'}
