name: Datadog MCP Server
description: >-
  Official Datadog MCP Server bridging Datadog observability data (APM, logs,
  metrics, monitors, dashboards, incidents, security signals, RUM, synthetics,
  CI Visibility, cloud cost, and more) to any MCP-compatible AI agent. Remote,
  HTTP transport with OAuth-based authentication scoped to the caller's own
  Datadog role permissions. Ships with 300+ tools organised into ~35 toolsets
  and a Datadog-managed JavaScript sandbox (`code-exec`) for multi-signal
  investigation in a single tool call.
server:
  name: datadog
  transport: http
  # Regional MCP hosts follow the pattern `mcp.<site>` — the setup page renders
  # the exact endpoint via the site selector; this US1 host was verified live
  # (HTTP 401 JSON on POST, which is the expected "unauthenticated" response).
  url: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
  regional_endpoints:
    US1: https://mcp.datadoghq.com/api/unstable/mcp-server/mcp
    EU:  https://mcp.datadoghq.eu/api/unstable/mcp-server/mcp
  unsupported_sites:
  - app.ddog-gov.com
  - us2.ddog-gov.com
  listings:
  - Cursor MCP directory ("Datadog", first-party plugin)
  - Claude Connector directory ("Datadog", first-party connector)
  - ChatGPT Apps directory (Preview, US1 only)
  - JetBrains IDE plugin ("Datadog")
  - VS Code / Copilot plugin marketplace ("Datadog")
  - Warp, Goose, OpenCode, Kiro, Devin, Grok Build, Gemini CLI, Codex CLI, Copilot CLI (direct HTTP)
auth:
  methods:
  - oauth2
  - env_credentials
  oauth2:
    flow: authorization_code_with_pkce
    ux: >-
      Client redirects the user to their Datadog site sign-in; on success the
      MCP client stores an access token and refreshes silently. A `subdomain`
      query parameter is supported for orgs on a custom Datadog subdomain so
      the OAuth flow starts on the right host.
  env_credentials:
    description: >-
      Some plugins (Claude Code, Copilot CLI) also accept Datadog API key +
      Application key via environment variables as an alternative to the
      interactive OAuth flow.
  permissions:
    read: mcp_read (plus the resource-level Datadog permission, e.g. monitors_read)
    write: mcp_write (plus the resource-level Datadog permission, e.g. monitors_write)
    note: >-
      The MCP Server forwards the authenticated user's own credentials to
      Datadog APIs. Existing RBAC, Data Access Control, and log restriction
      queries apply exactly as they do for direct API/UI access.
fair_use_rate_limits:
  burst: 50 requests per 10 seconds
  monthly_tool_calls: 100000
  source: https://docs.datadoghq.com/mcp_server.md
