notes: >-
  Endpoint probed 2026-09-23 with an unauthenticated POST to
  https://mcp.datadoghq.com/api/unstable/mcp-server/mcp and got HTTP 401
  application/json (27 bytes) — the expected control-plane response for a real
  MCP endpoint that requires OAuth. Root paths on `mcp.datadoghq.com` and
  `mcp.datadoghq.eu` return 404 for GET (as intended). Setup and tools pages
  fetched as markdown twins from docs.datadoghq.com (mcp_server.md,
  mcp_server/setup.md, mcp_server/tools.md), so all names, toolset lists,
  rate limits, and permissions are copied verbatim from the vendor docs. There
  is no local-stdio companion package; the server is remote-only.
deployment:
  mode: remote
