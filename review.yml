aid: datadog
provider: Datadog
review_type: streaming-surface-assessment
executed: '2026-05-29'
reviewer: API Evangelist
sources:
  - url: https://docs.datadoghq.com/api/
    type: api-index
  - url: https://docs.datadoghq.com/api/latest/
    type: api-reference
  - url: https://docs.datadoghq.com/logs/explorer/live_tail/
    type: live-tail-docs
  - url: https://docs.datadoghq.com/integrations/webhooks/
    type: webhooks-docs
  - url: https://docs.datadoghq.com/data_streams/
    type: data-streams-monitoring-docs
  - url: https://docs.datadoghq.com/api/latest/events/
    type: events-api-docs
  - url: https://docs.datadoghq.com/logs/log_collection/
    type: log-intake-docs

question: >-
  Does Datadog expose a documented public streaming surface
  (WebSocket / WSS, Server-Sent Events / SSE, Kafka, gRPC streaming,
  or HTTP long-poll/chunked streaming) that warrants an AsyncAPI spec?

verdict:
  asyncapi_warranted: false
  summary: >-
    Datadog does not document any public streaming surface. The Datadog API
    is explicitly described as an HTTP REST API. Live Tail is a UI-only
    feature inside the Log Explorer with no documented public streaming
    endpoint. Webhooks are outbound HTTP POST callbacks (event-driven, but
    not a streaming protocol in the AsyncAPI sense — already covered by
    REST + webhook patterns). Log intake supports HTTP and TCP but is
    inbound-only, and TCP is documented as unsupported / no delivery
    guarantees. No WSS, SSE, Kafka, or gRPC streaming endpoint is
    published.

surfaces_evaluated:

  - name: REST API
    present: true
    protocol: HTTPS
    notes: >-
      "The Datadog API is an HTTP REST API. The API uses resource-oriented
      URLs to call the API, uses status codes to indicate the success or
      failure of requests, returns JSON from all requests, and uses
      standard HTTP response codes." — docs.datadoghq.com/api/latest/
    spec: openapi/datadog-api-openapi.yml
    streaming: false

  - name: Outbound Webhooks
    present: true
    protocol: HTTPS POST callback
    notes: >-
      Datadog acts as the source. When a monitor triggers, Datadog issues
      an HTTP POST to a customer-supplied URL with JSON payload. Retries
      on 5xx, 15s timeout, up to 5 retries. This is an outbound webhook
      pattern (event-driven HTTP), not a streaming channel.
    streaming: false
    asyncapi_candidate: marginal
    asyncapi_candidate_note: >-
      Could be modeled as an AsyncAPI "webhook" binding, but it is
      adequately and conventionally described as REST + webhook payload
      schema. Not a sustained streaming connection.

  - name: Live Tail
    present: true
    protocol: UI-only (web app)
    notes: >-
      Live Tail is surfaced only inside the Log Explorer UI. The public
      docs describe it as a UI option in the timerange picker. There is
      no documented public WSS, SSE, or HTTP-chunked endpoint for
      programmatic Live Tail. The backend host live.logs.datadoghq.com
      exists for the web app but is not a documented public API surface.
    streaming: false
    asyncapi_candidate: false

  - name: Log Intake (inbound)
    present: true
    protocol: HTTPS, TCP/TLS (TCP unsupported per docs)
    notes: >-
      Customers send logs TO Datadog via HTTP/HTTPS (recommended) or TCP
      on ports 10514, 10516, 443. Docs state TCP collection is "not
      supported" and provides "no delivery or reliability guarantees."
      This is ingest, not an egress streaming API.
    streaming: false
    asyncapi_candidate: false

  - name: Datadog Forwarder (AWS Lambda)
    present: true
    protocol: AWS Lambda runtime, internal
    notes: >-
      Customer-deployed Lambda that forwards CloudWatch / S3 / EventBridge
      data into Datadog over HTTPS. Not a streaming API published by
      Datadog.
    streaming: false
    asyncapi_candidate: false

  - name: Data Streams Monitoring
    present: true
    protocol: observability product (not an API)
    notes: >-
      Despite the name, Data Streams Monitoring is an observability
      product that instruments Kafka / SQS / RabbitMQ / Kinesis clients
      running in CUSTOMER infrastructure. It is not a streaming API
      offered by Datadog.
    streaming: false
    asyncapi_candidate: false

  - name: WebSocket / WSS endpoint
    present: false
    notes: >-
      No public WebSocket endpoint is documented. The only WebSocket
      reference in Datadog docs is Synthetic Monitoring's WebSocket
      *test* feature, which lets Datadog probe customer WebSocket
      endpoints — Datadog is the client, not the server.
    streaming: false

  - name: Server-Sent Events (SSE) endpoint
    present: false
    notes: No SSE / text/event-stream endpoint documented in the public API.
    streaming: false

  - name: Kafka egress
    present: false
    notes: No public Kafka topic offered by Datadog for consumers.
    streaming: false

  - name: gRPC streaming
    present: false
    notes: >-
      No gRPC streaming surface in the public API. References to "grpc"
      in the OpenAPI specs are tag/metric names only (e.g.
      grpc.server.request.metadata).
    streaming: false

  - name: HTTP long-poll / chunked streaming
    present: false
    notes: >-
      No long-poll or chunked HTTP streaming endpoint is documented in
      the API reference.
    streaming: false

recommendation:
  produce_asyncapi: false
  rationale: >-
    No public streaming protocol exists to model. Producing an AsyncAPI
    document for Datadog would require fabricating endpoints, which
    violates the no-fabrication rule. The existing OpenAPI specs plus
    the documented webhooks integration fully describe Datadog's public
    asynchronous surface.
  next_steps:
    - Continue maintaining REST coverage via existing OpenAPI specs in openapi/.
    - If a webhook payload catalog is desired, model it as JSON Schema
      under json-schema/ rather than AsyncAPI.
    - Re-evaluate if Datadog publishes a Live Tail API, a public Kafka
      egress, or an SSE/WSS endpoint in the future.

evidence_quotes:
  - source: https://docs.datadoghq.com/api/latest/
    quote: >-
      The Datadog API is an HTTP REST API. The API uses resource-oriented
      URLs to call the API, uses status codes to indicate the success or
      failure of requests, returns JSON from all requests, and uses
      standard HTTP response codes.
  - source: https://docs.datadoghq.com/logs/explorer/live_tail/
    quote: >-
      In the Log Explorer, choose the Live Tail option in the timerange
      to query logs as they flow into Datadog.
    interpretation: UI affordance; no public API endpoint mentioned.
  - source: https://docs.datadoghq.com/logs/log_collection/
    quote: >-
      TCP log collection is not supported. Datadog provides no delivery
      or reliability guarantees when using TCP.
