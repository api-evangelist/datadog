components:
  schemas:
    LogsMetricResponseFilter:
      description: The log-based metric filter. Logs matching this filter will be aggregated in this metric.
      properties:
        query:
          description: The search query - following the log search syntax.
          example: service:web* AND @http.status_code:[200 TO 299]
          type: string
      type: object
    GitCommitSHA:
      description: Git Commit SHA.
      example: 66adc9350f2cc9b250b69abddab733dd55e1a588
      pattern: ^[a-fA-F0-9]{40,}$
      type: string
    MetricScalarQuery:
      type: object
      description: Request body for querying scalar metric data
      required:
      - data
      properties:
        data:
          type: object
          description: The scalar query data object
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The type identifier for the scalar query request
              enum:
              - scalar_request
            attributes:
              type: object
              description: The scalar query attributes
              required:
              - from
              - to
              - queries
              properties:
                from:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds for the start of the query time range
                to:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds for the end of the query time range
                queries:
                  type: array
                  description: List of metric queries to evaluate as scalar values
                  items:
                    $ref: '#/components/schemas/MetricQueryDefinition'
                formulas:
                  type: array
                  description: List of formula expressions combining the defined queries
                  items:
                    $ref: '#/components/schemas/QueryFormula'
    MetricTimeseriesQuery:
      type: object
      description: Request body for querying timeseries metric data
      required:
      - data
      properties:
        data:
          type: object
          description: The query data object containing type and attributes
          required:
          - type
          - attributes
          properties:
            type:
              type: string
              description: The type identifier for the query request
              enum:
              - timeseries_request
            attributes:
              type: object
              description: The query attributes including formulas, queries, and time range
              required:
              - from
              - to
              - queries
              properties:
                from:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds for the start of the query time range
                to:
                  type: integer
                  format: int64
                  description: Unix timestamp in milliseconds for the end of the query time range
                interval:
                  type: integer
                  format: int64
                  description: The granularity (in milliseconds) for returned data points
                queries:
                  type: array
                  description: List of metric queries to evaluate
                  items:
                    $ref: '#/components/schemas/MetricQueryDefinition'
                formulas:
                  type: array
                  description: List of formula expressions combining the defined queries
                  items:
                    $ref: '#/components/schemas/QueryFormula'
    MetricMonitorType:
      description: Monitor resource type.
      enum:
      - monitors
      example: monitors
      type: string
      x-enum-varnames:
      - MONITORS
    RumMetricUpdateRequest:
      description: The new rum-based metric body.
      properties:
        data:
          $ref: '#/components/schemas/RumMetricUpdateData'
      required:
      - data
      type: object
    MetricDistinctVolume:
      description: Object for a single metric's distinct volume.
      properties:
        attributes:
          $ref: '#/components/schemas/MetricDistinctVolumeAttributes'
        id:
          $ref: '#/components/schemas/MetricName'
        type:
          $ref: '#/components/schemas/MetricDistinctVolumeType'
      type: object
    JSONAPIErrorItem:
      description: API error response body
      properties:
        detail:
          description: A human-readable explanation specific to this occurrence of the error.
          example: Missing required attribute in body
          type: string
        meta:
          additionalProperties: {}
          description: Non-standard meta-information about the error
          type: object
        source:
          $ref: '#/components/schemas/JSONAPIErrorItemSource'
        status:
          description: Status code of the response.
          example: '400'
          type: string
        title:
          description: Short human-readable summary of the error.
          example: Bad Request
          type: string
      type: object
    SpansMetricComputeIncludePercentiles:
      description: 'Toggle to include or exclude percentile aggregations for distribution metrics.

        Only present when the `aggregation_type` is `distribution`.'
      example: false
      type: boolean
    MetricCustomAggregations:
      description: Deprecated. You no longer need to configure specific time and space aggregations for Metrics Without Limits.
      example:
      - space: sum
        time: sum
      - space: sum
        time: count
      items:
        $ref: '#/components/schemas/MetricCustomAggregation'
      type: array
    APIErrorResponse_2:
      type: object
      description: Standard API error response returned for failed requests
      required:
      - errors
      properties:
        errors:
          type: array
          description: List of error messages describing the failure
          items:
            type: string
    MetricBulkTagConfigDeleteRequest:
      description: Wrapper object for a single bulk tag deletion request.
      properties:
        data:
          $ref: '#/components/schemas/MetricBulkTagConfigDelete'
      required:
      - data
      type: object
    MetricBulkTagConfigDelete:
      description: Request object to bulk delete all tag configurations for metrics matching the given prefix.
      properties:
        attributes:
          $ref: '#/components/schemas/MetricBulkTagConfigDeleteAttributes'
        id:
          $ref: '#/components/schemas/MetricBulkTagConfigNamePrefix'
        type:
          $ref: '#/components/schemas/MetricBulkConfigureTagsType'
      required:
      - id
      - type
      type: object
    MetricQueryDefinition:
      type: object
      description: A metric query definition referencing a Datadog metrics query expression
      required:
      - name
      - data_source
      - query
      properties:
        name:
          type: string
          description: A unique name used to reference this query in formula expressions
          example: Example Monitor
        data_source:
          type: string
          description: The data source for the query
          enum:
          - metrics
          - cloud_cost
          example: metrics
        query:
          type: string
          description: The Datadog metrics query string (e.g., avg:system.cpu.user{*} by {host})
          example: avg:system.cpu.user{*}
    MetricScalarResponse:
      type: object
      description: Response containing scalar metric values for the requested queries
      properties:
        data:
          type: object
          description: The scalar response data
          properties:
            type:
              type: string
              description: The type identifier for the response
            id:
              type: string
              description: A unique identifier for this response
            attributes:
              type: object
              description: The response attributes
              properties:
                columns:
                  type: array
                  description: List of scalar result columns, one per query formula
                  items:
                    $ref: '#/components/schemas/ScalarColumn'
    MetricMetadata:
      description: Metadata for the metric.
      properties:
        origin:
          $ref: '#/components/schemas/MetricOrigin'
      type: object
    MetricVolumes:
      description: Possible response objects for a metric's volume.
      oneOf:
      - $ref: '#/components/schemas/MetricDistinctVolume'
      - $ref: '#/components/schemas/MetricIngestedIndexedVolume'
    LogsMetricCreateAttributes:
      description: The object describing the Datadog log-based metric to create.
      properties:
        compute:
          $ref: '#/components/schemas/LogsMetricCompute'
        filter:
          $ref: '#/components/schemas/LogsMetricFilter'
        group_by:
          description: The rules for the group by.
          items:
            $ref: '#/components/schemas/LogsMetricGroupBy'
          type: array
      required:
      - compute
      type: object
    LogsMetricResponseAttributes:
      description: The object describing a Datadog log-based metric.
      properties:
        compute:
          $ref: '#/components/schemas/LogsMetricResponseCompute'
        filter:
          $ref: '#/components/schemas/LogsMetricResponseFilter'
        group_by:
          description: The rules for the group by.
          items:
            $ref: '#/components/schemas/LogsMetricResponseGroupBy'
          type: array
      type: object
    DORADeploymentRequestAttributes:
      description: Attributes to create a DORA deployment event.
      properties:
        env:
          description: Environment name to where the service was deployed.
          example: staging
          type: string
        finished_at:
          description: Unix timestamp when the deployment finished. It must be in nanoseconds, milliseconds, or seconds, and it should not be older than 1 hour.
          example: 1693491984000000000
          format: int64
          type: integer
        git:
          $ref: '#/components/schemas/DORAGitInfo'
        id:
          description: Deployment ID.
          type: string
          example: abc-123-def
        service:
          description: Service name.
          example: shopist
          type: string
        started_at:
          description: Unix timestamp when the deployment started. It must be in nanoseconds, milliseconds, or seconds.
          example: 1693491974000000000
          format: int64
          type: integer
        team:
          description: Name of the team owning the deployed service. If not provided, this is automatically populated with the team associated with the service in the Service Catalog.
          example: backend
          type: string
        version:
          description: Version to correlate with [APM Deployment Tracking](https://docs.datadoghq.com/tracing/services/deployment_tracking/).
          example: v1.12.07
          type: string
      required:
      - service
      - started_at
      - finished_at
      type: object
    MetricCustomAggregation:
      description: A time and space aggregation combination for use in query.
      example:
        space: sum
        time: sum
      properties:
        space:
          $ref: '#/components/schemas/MetricCustomSpaceAggregation'
        time:
          $ref: '#/components/schemas/MetricCustomTimeAggregation'
      required:
      - time
      - space
      type: object
    DORAGitInfo:
      description: Git info for DORA Metrics events.
