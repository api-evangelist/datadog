openapi: 3.2.0
info:
  contact:
    email: support@datadoghq.com
    name: Datadog Support
    url: https://www.datadoghq.com/support/
  description: The Datadog API is an HTTP REST API. The API uses resource-oriented URLs to call the API, uses status codes to indicate the success or failure of requests, returns JSON from all requests, and uses standard HTTP response codes. Use the Datadog API to access the Datadog platform programmatically.
  title: Datadog Applications API
  version: '1.0'
servers:
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: The regional site for Datadog customers.
      enum:
      - datadoghq.com
      - us3.datadoghq.com
      - us5.datadoghq.com
      - ap1.datadoghq.com
      - datadoghq.eu
      - ddog-gov.com
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
- url: '{protocol}://{name}'
  variables:
    name:
      default: api.datadoghq.com
      description: Full site DNS name.
    protocol:
      default: https
      description: The protocol for accessing the API.
- url: https://{subdomain}.{site}
  variables:
    site:
      default: datadoghq.com
      description: Any Datadog deployment.
    subdomain:
      default: api
      description: The subdomain where the API is deployed.
security:
- apiKeyAuth: []
  appKeyAuth: []
tags:
- name: Applications
paths:
  /api/v2/app-builder/apps:
    delete:
      description: Delete multiple apps in a single request from a list of app IDs.
      operationId: DeleteApps
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAppsRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAppsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Not Found
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Datadog Delete Multiple Apps
      tags:
      - Applications
      x-menu-order: 3
      x-permission:
        operator: OR
        permissions:
        - apps_write
      x-undo:
        type: idempotent
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    get:
      description: List all apps, with optional filters and sorting. This endpoint is paginated. Only basic app information such as the app ID, name, and description is returned by this endpoint.
      operationId: ListApps
      parameters:
      - description: The number of apps to return per page.
        in: query
        name: limit
        required: false
        schema:
          format: int64
          type: integer
        example: 42
      - description: The page number to return.
        in: query
        name: page
        required: false
        schema:
          format: int64
          type: integer
        example: 42
      - description: Filter apps by the app creator. Usually the user's email.
        in: query
        name: filter[user_name]
        required: false
        schema:
          type: string
        example: Example Monitor
      - description: Filter apps by the app creator's UUID.
        example: 65bb1f25-52e1-4510-9f8d-22d1516ed693
        in: query
        name: filter[user_uuid]
        required: false
        schema:
          format: uuid
          type: string
      - description: Filter by app name.
        in: query
        name: filter[name]
        required: false
        schema:
          type: string
        example: Example Monitor
      - description: Filter apps by the app name or the app creator.
        in: query
        name: filter[query]
        required: false
        schema:
          type: string
        example: avg:system.cpu.user{*}
      - description: Filter apps by whether they are published.
        in: query
        name: filter[deployed]
        required: false
        schema:
          type: boolean
        example: true
      - description: Filter apps by tags.
        in: query
        name: filter[tags]
        required: false
        schema:
          type: string
        example: env:production
      - description: Filter apps by whether you have added them to your favorites.
        in: query
        name: filter[favorite]
        required: false
        schema:
          type: boolean
        example: true
      - description: Filter apps by whether they are enabled for self-service.
        in: query
        name: filter[self_service]
        required: false
        schema:
          type: boolean
        example: true
      - description: The fields and direction to sort apps by.
        explode: false
        in: query
        name: sort
        required: false
        schema:
          items:
            $ref: '#/components/schemas/AppsSortField'
          type: array
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAppsResponse'
          description: OK
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Datadog List Apps
      tags:
      - Applications
      x-menu-order: 1
      x-permission:
        operator: OR
        permissions:
        - apps_run
      x-undo:
        type: safe
      x-api-evangelist-processing:
        PascalCaseOperationSummaries: true
        ChooseTags: true
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
    post:
      description: Create a new app, returning the app ID.
      operationId: CreateApp
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAppResponse'
          description: Created
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Bad Request
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JSONAPIErrorResponse'
          description: Forbidden
        '429':
          $ref: '#/components/responses/TooManyRequestsResponse'
      summary: Datadog Create App
