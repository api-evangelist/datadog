  response: application/json
reversibility:
  status: partial-write-surface
  note: >-
    Datadog has many write surfaces; reversibility varies by resource. Common
    reversal paths documented in the contract include:
      - Monitors: DELETE /api/v1/monitor/{monitor_id} and PATCH to restore/mute
        via mute/unmute endpoints.
      - Downtimes: /api/v2/downtime supports create/update/cancel.
      - Incidents: PATCH /api/v2/incidents/{incident_id} for update; incidents
        remain in place after resolution.
      - Dashboards / users / API keys: standard delete/update; no restore
        window is documented at the API layer.
    Windows are not published; agents should not assume any restore-after-delete
    grace period.
  documented: partial
  verified: false
