metadata_and_tracing:
  request_id:
    documented: false
    note: >-
      The public docs do not describe a persistent per-request correlation
      header on the HTTP API surface. Datadog's own products (APM/RUM) attach
      trace headers to instrumented workloads, but these are agent SDK concerns
      rather than an external API convention.
regional_hosts:
  description: >-
    Callers must select the correct regional host (server) that matches the
    site of the account. The `Authentication -> Validate API Key` page enumerates
    the endpoints per site.
  see_also: authentication/datadog-authentication.yml
content_types:
