idempotency:
  coverage: none
  scope: []
  note: >-
    The Datadog OpenAPI contract does not define an idempotency-key header on
    any write operation, and the docs do not describe replay protection at the
    API layer. Retries on non-idempotent writes may create duplicate resources.
