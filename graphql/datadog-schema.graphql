"""A configured Datadog integration with a third-party service."""
type Integration {
  id: ID!
  type: String!
  attributes: JSON
  isInstalled: Boolean
}

"""A Datadog webhook endpoint for outbound notifications."""
type Webhook {
  name: String!
  url: String!
  customHeaders: String
  encodeAs: String
  payload: String
}

input CreateWebhookInput {
  name: String!
  url: String!
  customHeaders: String
  encodeAs: String
  payload: String
}

