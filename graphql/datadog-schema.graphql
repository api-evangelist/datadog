# ─────────────────────────────────────────────
# API Keys and App Keys
# ─────────────────────────────────────────────

"""A Datadog API key for authenticating API requests."""
type APIKey {
  id: ID!
  name: String!
  key: String
  last4: String
  created: DateTime
  modified: DateTime
  createdBy: User
  modifiedBy: User
  category: String
  remoteConfigReadEnabled: Boolean
}

"""A Datadog application key associated with a user."""
type AppKey {
  id: ID!
  name: String!
  key: String
  last4: String
  created: DateTime
  createdBy: User
  scopes: [String!]
  hash: String
}

"""A request for elevated access or permissions."""
type AccessRequest {
  id: ID!
  requestor: User
  resource: String!
  scope: String
  status: String!
  created: DateTime
}

input CreateAPIKeyInput {
  name: String!
  remoteConfigReadEnabled: Boolean
}

