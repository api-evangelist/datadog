# ─────────────────────────────────────────────
# Service Catalog
# ─────────────────────────────────────────────

"""The Datadog Software / Service Catalog."""
type ServiceCatalog {
  services: [ServiceDefinition!]!
  totalCount: Int!
}

"""A service definition in the Datadog Service Catalog."""
type ServiceDefinition {
  id: ID!
  schema: ServiceDefinitionSchema!
  meta: ServiceDefinitionMeta
  rawSchema: JSON
}

type ServiceDefinitionSchema {
  schemaVersion: String!
  ddService: String!
  team: String
  description: String
  tier: String
  lifecycle: String
  contacts: [ServiceContact!]
  repos: [ServiceRepo!]
  tags: [String!]
  integrations: JSON
  extensions: JSON
  languages: [String!]
  links: [ServiceLink!]
}

type ServiceContact {
  name: String
  type: String!
  contact: String!
}

type ServiceRepo {
  name: String
  provider: String!
  url: String!
}

type ServiceLink {
  name: String!
  type: String!
  url: String!
  provider: String
}

type ServiceDefinitionMeta {
  lastModifiedTime: DateTime
  githubHtmlUrl: String
  warnings: [JSON!]
  ingressUrls: [String!]
  origin: String
  originDetail: String
}

# ─────────────────────────────────────────────
# Shared / Utility Types
# ─────────────────────────────────────────────

"""Identifies the author or creator of a Datadog resource."""
type Creator {
  id: ID
  email: String
  handle: String
  name: String
}

"""A page cursor for paginated results."""
type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
  totalCount: Int
}

# ─────────────────────────────────────────────
# Root Types
# ─────────────────────────────────────────────

type Query {
  """List metrics matching a filter."""
  metrics(filter: MetricFilter): [Metric!]!

  """Fetch metadata for a specific metric by name."""
  metric(metricName: String!): Metric

  """List hosts matching a filter."""
  hosts(filter: HostFilter): [Host!]!

  """Fetch a host by name."""
  host(hostName: String!): Host

  """List all dashboards."""
  dashboards: [Dashboard!]!

  """Fetch a specific dashboard by ID."""
  dashboard(id: ID!): Dashboard

  """List monitors matching a filter."""
  monitors(filter: MonitorFilter): [Monitor!]!

  """Fetch a specific monitor by ID."""
  monitor(id: ID!): Monitor

  """List downtimes."""
  downtimes: [Downtime!]!

  """List SLOs matching a filter."""
  slos(filter: SLOFilter): [SLO!]!

  """Fetch a specific SLO with history."""
  slo(id: ID!, fromTs: DateTime!, toTs: DateTime!): SLO

  """Search log events."""
  logs(query: LogQuery!): [Log!]!

  """List log indexes."""
  logIndexes: [LogIndex!]!

  """List log pipelines."""
  logPipelines: [LogPipeline!]!

  """List log archives."""
  logArchives: [LogArchive!]!

  """Search events in the event stream."""
  events(query: EventQueryInput!): [Event!]!

  """Search APM traces."""
  traces(query: JSON!): [APMTrace!]!

  """List APM services."""
  apmServices(env: String, start: DateTime!, end: DateTime!): [APMService!]!

  """Search security signals."""
  securitySignals(filter: SecurityFilter!): [SecuritySignal!]!

  """List security detection rules."""
  securityRules: [SecurityRule!]!

  """List incidents matching a filter."""
  incidents(filter: IncidentFilter): [Incident!]!

  """Fetch a specific incident."""
  incident(id: ID!): Incident

  """List organization users."""
  users: [User!]!

  """Fetch a specific user."""
  user(id: ID!): User

  """List teams."""
  teams: [Team!]!

  """List roles."""
  roles: [Role!]!

  """Fetch the current organization."""
  organization: Organization

  """List API keys."""
  apiKeys: [APIKey!]!

  """List application keys."""
  appKeys: [AppKey!]!

  """Retrieve usage summary for a date range."""
  usageSummary(startMonth: String!, endMonth: String): UsageSummary

  """Query cloud cost data."""
  cloudCosts(filter: CloudCostFilter!): [CloudCost!]!

  """List service catalog entries."""
  serviceCatalog: ServiceCatalog

  """Fetch a service definition by service name."""
  serviceDefinition(serviceName: String!): ServiceDefinition

  """List configured integrations."""
  integrations: [Integration!]!

  """List configured webhooks."""
  webhooks: [Webhook!]!

  """Get SLO corrections for an SLO."""
  sloCorrections(sloId: ID!): [SLOCorrection!]!

  """Get infrastructure map."""
  infrastructureMap(filter: JSON): InfrastructureMap
}

type Mutation {
  """Create a new monitor."""
  createMonitor(input: CreateMonitorInput!): Monitor!

  """Update an existing monitor."""
  updateMonitor(id: ID!, input: UpdateMonitorInput!): Monitor!

  """Delete a monitor."""
  deleteMonitor(id: ID!): Boolean!

  """Mute a monitor."""
  muteMonitor(id: ID!, input: MuteInput!): Monitor!

  """Unmute a monitor."""
  unmuteMonitor(id: ID!): Monitor!

  """Schedule a downtime."""
  createDowntime(input: CreateDowntimeInput!): Downtime!

  """Cancel a downtime."""
  cancelDowntime(id: ID!): Boolean!

  """Create a new dashboard."""
  createDashboard(input: CreateDashboardInput!): Dashboard!

  """Update a dashboard."""
  updateDashboard(id: ID!, input: UpdateDashboardInput!): Dashboard!

  """Delete a dashboard."""
  deleteDashboard(id: ID!): Boolean!

  """Create a new SLO."""
  createSLO(input: CreateSLOInput!): SLO!

  """Update an SLO."""
  updateSLO(id: ID!, input: UpdateSLOInput!): SLO!

  """Delete an SLO."""
  deleteSLO(id: ID!): Boolean!

  """Add an SLO correction window."""
  createSLOCorrection(input: CreateSLOCorrectionInput!): SLOCorrection!

  """Declare an incident."""
  createIncident(input: CreateIncidentInput!): Incident!

  """Update an incident."""
  updateIncident(id: ID!, input: UpdateIncidentInput!): Incident!

  """Resolve an incident."""
  resolveIncident(id: ID!): Incident!

  """Invite a user to the organization."""
  createUser(input: CreateUserInput!): User!

  """Disable a user."""
  disableUser(id: ID!): Boolean!

  """Create an API key."""
  createAPIKey(input: CreateAPIKeyInput!): APIKey!

  """Delete an API key."""
  deleteAPIKey(id: ID!): Boolean!

  """Register a webhook."""
  createWebhook(input: CreateWebhookInput!): Webhook!

  """Delete a webhook."""
  deleteWebhook(name: String!): Boolean!

  """Mute a host."""
  muteHost(hostName: String!, message: String, end: DateTime): HostMute!

  """Unmute a host."""
  unmuteHost(hostName: String!): Boolean!
}
