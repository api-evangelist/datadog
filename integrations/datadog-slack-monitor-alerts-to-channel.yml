arazzo: 1.0.1
info:
  title: Datadog Slack monitor alerts to channel
  summary: Post Datadog monitors in alert state to a Slack channel
  description: Lists Datadog monitors filtered to the alert group state and posts the first alerting monitor's name and message to a Slack channel. Recreated from the Datadog-Slack Zapier edge linked in x-integration.
  version: 1.0.0
sourceDescriptions:
- name: datadogMonitors
  url: https://raw.githubusercontent.com/api-evangelist/datadog/refs/heads/main/openapi/datadog-monitors-api-openapi.yml
  type: openapi
- name: slackChat
  url: https://raw.githubusercontent.com/api-evangelist/slack/refs/heads/main/openapi/slack-chat-api-openapi.yml
  type: openapi
workflows:
- workflowId: datadog-monitor-alerts-to-slack
  summary: Post alerting Datadog monitors to Slack
  description: Reads alerting monitors from Datadog and posts a summary message to Slack.
  inputs:
    type: object
    properties:
      slackToken:
        type: string
        description: Slack token with chat:write scope
      channel:
        type: string
        description: Slack channel ID or name
  steps:
  - stepId: list-alerting-monitors
    description: List Datadog monitors in the alert group state.
    operationId: $sourceDescriptions.datadogMonitors.listMonitors
    parameters:
    - name: group_states
      in: query
      value: alert
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      monitorName: $response.body#/0/name
      monitorMessage: $response.body#/0/message
  - stepId: post-to-slack
    description: Post the alerting monitor to the Slack channel.
    operationId: $sourceDescriptions.slackChat.postChatPostmessage
    parameters:
    - name: token
      in: header
      value: $inputs.slackToken
    requestBody:
      contentType: application/x-www-form-urlencoded
      payload:
        channel: $inputs.channel
        text: $steps.list-alerting-monitors.outputs.monitorName
    successCriteria:
    - condition: $statusCode == 200
    outputs:
      ts: $response.body#/ts
  outputs:
    messageTs: $steps.post-to-slack.outputs.ts
x-integration:
  partner: slack
  edge_evidence: https://zapier.com/apps/datadog/integrations/slack
  edge_type: marketplace
  method: generated
  generated: '2026-10-13'
  generator: claude-opus-5.5 market-workflows
  guessed_steps:
  - step: list-alerting-monitors
    cause: catalog
    why: the Zapier edge names no specific trigger; choosing alerting monitors as the trigger is an inference, and the /0/name and /0/message paths assume a non-empty array
